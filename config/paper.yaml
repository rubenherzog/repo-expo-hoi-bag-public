inputs:
  cohort_csv: data/raw/all_exposome_bag_clean_expo63_countryyear_only_complete_cases.csv
  feature_domains_csv: data/metadata/exposome_feature_domains.csv
  feature_names_csv: data/metadata/exposome_feature_names.csv

analysis:
